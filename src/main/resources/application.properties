spring.application.name=hr_management

# Database Configuration (Credentials injected via .env / environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hrmanagement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool Optimization for Concurrent Queries
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JWT Configuration (Secret injected via .env / environment variables)
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}

# Postmark Email Integration (Credentials injected via .env / environment variables)
app.postmark.server-token=${POSTMARK_SERVER_TOKEN:}
app.postmark.sender-email=${POSTMARK_SENDER_EMAIL:}
app.postmark.enabled=${POSTMARK_ENABLED:true}
app.postmark.message-stream=${POSTMARK_MESSAGE_STREAM:outbound}
